version: '3'

includes:
  build-vbantxt:
    taskfile: ./Taskfile.build.yml
    internal: true
    vars:
      PROGRAM: vbantxt
  build-vbantxtctl:
    taskfile: ./Taskfile.build.yml
    internal: true
    vars:
      PROGRAM: vbantxtctl
  man-vbantxt:
    taskfile: ./Taskfile.man.yml
    vars:
      PROGRAM: vbantxt
  man-vbantxtctl:
    taskfile: ./Taskfile.man.yml
    vars:
      PROGRAM: vbantxtctl

vars:
  SHELL: '{{if eq .OS "Windows_NT"}}powershell{{end}}'
  BIN_DIR: bin
  VERSION:
    sh: 'git describe --tags $(git rev-list --tags --max-count=1)'

tasks:
  default:
    desc: Build the vbantxt project
    cmds:
      - task: build

  build:
    desc: Build the vbantxt and vbantxtctl projects for all platforms
    deps: [vet]
    cmds:
      - for:
          matrix:
            PROGRAM: ['build-vbantxt', 'build-vbantxtctl']
            TARGET: ['windows-amd64', 'linux-amd64', 'darwin-amd64']
        task: '{{.ITEM.PROGRAM}}:{{.ITEM.TARGET}}'

  vet:
    desc: Vet the code
    deps: [fmt]
    cmds:
      - go vet ./...

  fmt:
    desc: Fmt the code
    cmds:
      - go fmt ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  clean:
    desc: Clean the build artifacts
    cmds:
      - '{{.SHELL}} rm -r {{.BIN_DIR}}'

  generate:
    desc: Run code generation
    cmds:
      - COLUMNS=120 go generate ./...
